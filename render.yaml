services:
  - type: web
    name: ashikaaktar-portfolio
    env: docker
    plan: free
    region: singapore
    dockerfilePath: Dockerfile
    envVars:
      - key: APP_NAME
        value: ASHIKA
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_KEY
        generateValue: true
      - key: RUN_MIGRATIONS
        value: "true"
      - key: DB_CONNECTION
        value: sqlite
